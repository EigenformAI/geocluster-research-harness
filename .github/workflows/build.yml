name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: Agent — tests + VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies
        # cli/ is an npm workspace of agent/ — covered by the root npm ci
        working-directory: agent
        run: |
          npm ci
          cd webview-ui && npm ci

      - name: Generate protos
        working-directory: agent
        run: npm run protos

      - name: Unit tests (includes design-invariants suite)
        working-directory: agent
        run: npm run test:unit

      - name: Package extension
        working-directory: agent
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run package
          npx vsce package --allow-package-secrets sendgrid --no-dependencies --out ../geology-agent.vsix

      - name: Build CLI
        working-directory: agent
        run: npm run cli:build:production

      - uses: actions/upload-artifact@v4
        with:
          name: geology-agent-vsix
          path: geology-agent.vsix

  helper-extensions:
    name: Helper extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build geology-formats + csv-viewer
        run: |
          cd extensions/geology-formats && npm ci && npm run package && cd ../..
          cd extensions/csv-viewer && npm ci && npm run package

  docker:
    name: Docker compose smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'

      - name: docker compose build
        if: matrix.platform == 'linux/arm64'
        run: docker compose build

      - name: docker compose up --build
        if: matrix.platform == 'linux/amd64'
        run: docker compose up --build -d

      - name: Wait for healthy
        if: matrix.platform == 'linux/amd64'
        run: |
          timeout 300 bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" geocluster-research-harness)" = "healthy" ]; do
              sleep 5
            done
          '

      - name: Show logs on failure
        if: failure() && matrix.platform == 'linux/amd64'
        run: docker compose logs

      - name: Tear down
        if: always() && matrix.platform == 'linux/amd64'
        run: docker compose down -v
