name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  secret-scan:
    name: Secret scan (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --results=verified

  artifacts:
    name: VSIX + CLI bundle
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies
        working-directory: agent
        run: |
          npm ci
          cd webview-ui && npm ci
          cd ../cli && npm ci

      - name: Build VSIX
        working-directory: agent
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run protos
          npm run package
          npx vsce package --allow-package-secrets sendgrid --no-dependencies \
            --out ../geology-agent-${{ github.ref_name }}.vsix

      - name: Build CLI bundle
        working-directory: agent
        run: |
          npm run cli:build:production
          mkdir -p ../cli-bundle/cline-cli
          cp -r cli/dist ../cli-bundle/cline-cli/dist
          cp cli/package.json ../cli-bundle/cline-cli/
          [ -f cli/package-lock.json ] && cp cli/package-lock.json ../cli-bundle/cline-cli/ || true
          tar -czf ../geology-agent-cli-${{ github.ref_name }}.tar.gz -C ../cli-bundle cline-cli

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            geology-agent-${{ github.ref_name }}.vsix
            geology-agent-cli-${{ github.ref_name }}.tar.gz

  image:
    name: Multi-arch image → GHCR
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
