name: Fly qualified native release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      qualification_timeout_minutes:
        description: Disposable Fly qualification budget, integer 1–60 minutes (native watchdog is 120s)
        type: number
        default: 10
        required: true
concurrency:
  group: deploy-group
  cancel-in-progress: false
jobs:
  build:
    name: Build and locally qualify exact digest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PREPROCESSING_BUNDLE_REPO: EigenformAI/geocluster-data-preprocessing-service
      PREPROCESSING_BUNDLE_TAG: preprocessing-d0631c8
      PREPROCESSING_BUNDLE_DIGEST: 82b40ed2ce2a3137992726958eb82083b14455c8e4ca914dfeba2dcdccc22847
    outputs:
      candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
      qualification_timeout_ms: ${{ steps.budget.outputs.qualification_timeout_ms }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Fly qualification budget
        id: budget
        env:
          QUALIFICATION_MINUTES: ${{ github.event_name != 'workflow_dispatch' && '10' || format('{0}', inputs.qualification_timeout_minutes) }}
        run: |
          FLY_QUALIFICATION_TIMEOUT_MS="$(node -e 'const n=Number(process.env.QUALIFICATION_MINUTES); if (!Number.isSafeInteger(n) || n < 1 || n > 60) { console.error("qualification_timeout_minutes must be an integer from 1 to 60"); process.exit(1); } process.stdout.write(String(n*60000))')"
          echo "qualification_timeout_ms=$FLY_QUALIFICATION_TIMEOUT_MS" >> "$GITHUB_OUTPUT"
      - name: Verify release orchestration
        run: node --test scripts/processor-workflow-security.test.mjs scripts/fly-native-release.test.mjs scripts/fly-qualification-timeout.test.mjs

      # The release is an immutable tar produced by preprocessing-bundle.py, attached as the asset
      # `source.tar` to a release of the private processor repo. Source and digest are explicit build
      # inputs; no extraction code is fetched at boot. The token is a fine-grained PAT with read-only
      # Contents access to that repo alone.
      - name: Obtain pinned preprocessing source bundle
        env:
          GH_TOKEN: ${{ secrets.PREPROCESSING_BUNDLE_TOKEN }}
        run: |
          python3 runtime/test/image/processor-ci-inputs.py --output "$RUNNER_TEMP/preprocessing-bundle" --test-output "$RUNNER_TEMP/processor-tests"

      - uses: docker/setup-buildx-action@v3
      - name: Build and push pinned runtime image
        id: candidate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          docker buildx build --push --platform linux/amd64 --provenance=false --sbom=false --metadata-file "$RUNNER_TEMP/runtime-build-metadata.json" --build-context preprocessing_bundle="$RUNNER_TEMP/preprocessing-bundle" --build-arg PREPROCESSING_BUNDLE_DIGEST="$PREPROCESSING_BUNDLE_DIGEST" --build-arg RUNTIME_BUILD_SHA="${{ github.sha }}" --tag "registry.fly.io/geocluster-ai-ide:${{ github.sha }}" .
          node --input-type=module -e '
            import fs from "node:fs";
            const metadata = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/runtime-build-metadata.json", "utf8"));
            const digest = metadata["containerimage.digest"];
            if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error("Missing immutable build digest");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "candidate_digest=registry.fly.io/geocluster-ai-ide@" + digest + "\n");
          '

      - name: Qualify installed native readers locally on the exact digest
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.candidate_digest }}
        run: node runtime/test/image/native-test.mjs --image "$CANDIDATE_DIGEST"

      - name: Qualify installed processor and real engine locally on the exact digest
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.candidate_digest }}
        run: npm --prefix runtime run test:image:processor -- --image "$CANDIDATE_DIGEST" --expected-bundle-digest "$PREPROCESSING_BUNDLE_DIGEST" --processor-source "$RUNNER_TEMP/processor-tests" --deadline-ms 600000 --report "$RUNNER_TEMP/processor-image-report.json"

      - name: Retain bounded processor development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processor-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/processor-image-report.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Qualify on Fly and publish exact digest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
        timeout-minutes: 3
      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
        timeout-minutes: 3
      - name: Authenticate registry digest inspection
        timeout-minutes: 3
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Qualify on Fly, clean qualification resources, and publish exact digest
        timeout-minutes: 90
        env:
          CANDIDATE_DIGEST: ${{ needs.build.outputs.candidate_digest }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG_SLUG: ${{ vars.FLY_ORG_SLUG || 'kip-protocol-services-1' }}
          FLY_QUALIFICATION_TIMEOUT_MS: ${{ needs.build.outputs.qualification_timeout_ms }}
          FLY_RELEASE_REPORT: ${{ runner.temp }}/fly-native-release-report.json
        run: node scripts/fly-native-release.mjs

      - name: Finalize captured resource IDs
        if: always()
        timeout-minutes: 3
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_RELEASE_REPORT: ${{ runner.temp }}/fly-native-release-report.json
        run: |
          if [ -f "$FLY_RELEASE_REPORT" ]; then
            node scripts/fly-native-release.mjs --cleanup
          fi

      - name: Retain safe qualification and publication evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fly-native-release-report.json
          if-no-files-found: warn
          retention-days: 14
