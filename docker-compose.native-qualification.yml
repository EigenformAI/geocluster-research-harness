# Local native-reader confinement check. Build the runtime image first (README.md), then:
#   RUNTIME_BASE_IMAGE=geocluster-runtime:local docker compose -f docker-compose.native-qualification.yml up --build -d
#   docker compose -f docker-compose.native-qualification.yml exec -T native-runtime \
#     gosu gc-files node /opt/geocluster-runtime/scripts/qualify-native-readers.mjs
# It must exit 0: both readers report state "available" with confinement "verified". Stop with `docker compose -f
# docker-compose.native-qualification.yml down`; add --volumes only to discard test state.

services:
  native-runtime:
    image: geocluster-runtime:native-confinement-local
    build:
      context: .
      dockerfile: Dockerfile.gis-overlay
      args:
        BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-geocluster-runtime:latest}
        RUNTIME_BUILD_SHA: native-confinement-local
    command: ["tui"]
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
    mem_limit: 4g
    cpus: 2
    environment:
      RUNTIME_PROFILE: native
      PROJECT_ID: native-qualification
      USER_ID: qualification
      SYNC_ENABLED: "false"
      FILES_SYNC_ADAPTER: "false"
      OWNED_DEMO_ENABLED: "false"
      PREPROCESSING_ENABLED: "false"
      RUNTIME_AGGREGATE_ACTIVITY: "false"
      FILES_GIS_WORKER_ENABLED: "true"
      FILES_WORKBOOK_WORKER_ENABLED: "true"
    volumes:
      - native-workspace:/workspace
    stop_grace_period: 300s
volumes:
  native-workspace:
